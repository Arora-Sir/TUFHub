<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUFHub</title>
  <link rel="stylesheet" href="css/popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="brand">
        <img src="assets/icons/icon48.png" class="brand-icon-img" alt="TUFHub" style="width: 24px; height: 24px; vertical-align: middle; border-radius: 6px; margin-right: 6px;" />
        <span class="brand-title">TUFHub</span>
      </div>
      <button id="disconnect-btn" class="profile-cta danger-btn" title="Disconnect GitHub">Disconnect</button>
    </header>

    <main class="popup-body">
      <!-- Unauthenticated State -->
      <div id="unauth-section" class="card hidden">
        <p class="card-subtitle">Connect your GitHub account to auto-sync your TUF+ solutions.</p>
        <button id="connect-btn" class="profile-cta primary-btn">Connect with GitHub</button>
      </div>

      <!-- Authenticated State -->
      <div id="auth-section" class="card">
        <div class="user-badge">
          <a id="dev-profile-link" href="#" target="_blank" rel="noopener noreferrer" class="dev-badge-link" title="View GitHub Profile">
            <span class="status-dot"></span>
            <span id="user-handle" class="user-handle">@GitHub User</span>
            <span class="ext-icon">↗</span>
          </a>
        </div>

        <div class="stats-grid">
          <div class="stat-box">
            <span id="stat-solved" class="stat-number">0</span>
            <span class="stat-label">Solved</span>
          </div>
          <div class="stat-box">
            <span id="stat-easy" class="stat-number easy">0</span>
            <span class="stat-label">Easy</span>
          </div>
          <div class="stat-box">
            <span id="stat-medium" class="stat-number medium">0</span>
            <span class="stat-label">Medium</span>
          </div>
          <div class="stat-box">
            <span id="stat-hard" class="stat-number hard">0</span>
            <span class="stat-label">Hard</span>
          </div>
        </div>

        <div style="display: flex; gap: 8px; margin-top: 10px;">
          <a id="repo-link" href="#" target="_blank" rel="noopener noreferrer" class="profile-cta secondary-btn network-btn" style="flex: 1;">
            View Repository
          </a>
          <button id="sync-repo-btn" class="profile-cta secondary-btn" style="width: auto; padding: 0 12px;" title="Sync stats from GitHub repository">
            ↻ Sync
          </button>
        </div>
      </div>

      <!-- Sync Health Diagnostics -->
      <details id="health-section" class="card" style="margin-top: 10px;">
        <summary style="cursor: pointer; font-weight: 600; font-size: 12px; display: flex; align-items: center; gap: 7px; list-style: none;">
          <span id="health-dot" style="width: 8px; height: 8px; border-radius: 50%; background: #6b7280; flex: 0 0 auto;"></span>
          <span>Sync Health</span>
          <span id="health-summary" style="margin-left: auto; opacity: 0.65; font-weight: 500;">Checking...</span>
          <span aria-hidden="true" style="opacity: 0.5; font-size: 10px;">&#9662;</span>
        </summary>
        <div id="stale-build-banner" class="hidden" style="margin-top: 8px; padding: 8px 10px; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 6px; color: #f87171; font-size: 11px; line-height: 1.4; overflow-wrap: anywhere; word-break: break-word;"></div>
        <div id="health-body" style="margin-top: 10px; font-size: 11px; line-height: 1.75; overflow-wrap: anywhere; word-break: break-word;"></div>
        <div style="display: flex; gap: 6px; margin-top: 10px;">
          <button id="copy-diag-btn" class="profile-cta secondary-btn" style="flex: 1; padding: 6px 8px; font-size: 11px;">
            Copy Diagnostics
          </button>
        </div>
      </details>

      <!-- Support & Developer Section -->
      <section class="support-section">
        <p class="support-title">Support TUFHub & Practice</p>
        <div class="support-grid">
          <a id="tuf-course-btn" href="https://takeuforward.org/plus?affiliate=arorasir" target="_blank" rel="noopener noreferrer" class="network-btn support-chip highlight-chip" title="Join official TakeUForward (TUF+) course">
            🎓 TUF+ Course
          </a>
          <a id="star-repo-btn" href="https://github.com/Arora-Sir/TUFHub" target="_blank" rel="noopener noreferrer" class="network-btn support-chip" title="Give TUFHub a star on GitHub">
            ⭐ Star Repo
          </a>
          <a id="paypal-btn" href="https://paypal.me/arorasir" target="_blank" rel="noopener noreferrer" class="network-btn support-chip">
            ☕ PayPal
          </a>
          <button id="upi-btn" class="network-btn support-chip">
            📱 UPI QR
          </button>
        </div>

        <div id="upi-modal" class="upi-box hidden">
          <img src="assets/upi_qr.png" alt="UPI QR Code" class="upi-qr-img" onerror="this.style.display='none'">
          <div class="upi-id-copy">
            <code>mohit1998arora@yescred</code>
            <button id="copy-upi-btn" class="copy-chip">Copy</button>
          </div>
        </div>
      </section>

      <footer class="popup-footer">
        Crafted with ❤️ by <a href="https://github.com/Arora-Sir" target="_blank" rel="noopener noreferrer" class="dev-footer-link">Mohit Arora (@Arora-Sir)</a>
      </footer>
    </main>
  </div>

  <script src="scripts/popup.js"></script>
</body>
</html>
